<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrando Usuários</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="cadastro">
            <h1>Cadastro Usuário</h1>
            <form id="formulario">
                <label for="nome"></label>
                <input type="text" id="CampoNome" name="CampoNome" placeholder="Nome Completo" required>

                <label for="cargo"></label>
                <input type="text" id="CampoCargo" name="CampoCargo" placeholder="Cargo ou função" required>

                <button type="submit">Salvar no Sistema</button>
                
            </form>
        </div>
        <div class="cadastro">
            <h2>Usuários Cadastrados</h2>
            <ul id="listaVisual">
                
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
